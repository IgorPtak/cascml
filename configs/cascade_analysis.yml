case: xi_test_hyperloop

input: 
  files:
  - ../../data/AO2D_derived_test_hyperloop.root
  df_prefix: DF_
  tree: O2camlcandidates
  step_size: 100 MB

features:
  cascradius:          {column: fCascRadius}
  v0radius:            {column: fV0radius}
  casccosPA:           {column: fCascPA, transform: cos}
  v0cosPA:             {column: fV0PA,   transform: cos}
  dcapostopv:          {column: fDCApostopv}
  dcanegtopv:          {column: fDCAnegtopv}
  dcabachtopv:         {column: fDCAbachtopv}
  dcacascdaughters:    {column: fDCACascDaughters}
  dcaV0daughters:      {column: fDCAV0daughters}
  dcav0topv:           {column: fDCAv0topv}
  bachBaryonCosPA:     {column: fBachBaryonCosPA}
  bachBaryonDCAxyToPV: {column: fBachBaryonDCAxyToPV}

# Stored in the samples for physics checks (mass sculpting, centrality); never model inputs.
meta_columns:
  mass_xi:    {column: fMXi}
  mass_omega: {column: fMOmega}
  centrality: {column: fCentrality}

species:
  xi:
    mass_window_bit: 0
    signal_flags: {minus: fIsXiMinus, plus: fIsXiPlus}
    split_by_charge: false
    pt_bins: [0.5, 1.5, 3.0, 10.0]

classes:
  - {name: bkg, source: mc}
  - {name: signal, source: mc}

tree_creator_cuts:
  getXiMinus: false
  getXiPlus: false
  getOmegaMinus: false
  getOmegaPlus: false
  xiMassWindow: 0.06
  omegaMassWindow: 0.06
  v0setting_cospa: 0.9
  v0setting_dcav0dau: 2.0
  v0setting_dcapostopv: 0.05
  v0setting_dcanegtopv: 0.05
  v0setting_radius: 0.9
  cascadesetting_cospa: 0.9
  cascadesetting_dcacascdau: 2.0
  cascadesetting_dcabachtopv: 0.05
  cascadesetting_cascradius: 0.5
  cascadesetting_v0masswindow: 0.02
  cascadesetting_mindcav0topv: 0.0

split:
  test_size: 0.3
  n_folds: 5
  random_state: 42

guards:
  min_signal_train: 200
  min_signal_test: 50

validation:
  auc_ci: {method: delong, level: 0.95}  # method: delong | bootstrap
  bootstrap: {n: 1000}                   # replicas, used only with auc_ci.method: bootstrap
  working_points: [0.7, 0.8, 0.9]

export:
  onnx_dir_name: onnx
