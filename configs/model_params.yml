default:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  tree_method: hist
  eval_metric: auc
  early_stopping_rounds: 30
  n_jobs: -1

per_species:
  xi: {}
  omega:
    max_depth: 3
    n_estimators: 200
    min_child_weight: 10
    scale_pos_weight: auto  # per pT bin: n_bkg / n_sig of the training folds
