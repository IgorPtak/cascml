case: omega_pbpb

# MC PbPb, trains from 2026-11-12 (omegaMassWindow 0.02). data/pbpb/ holds symlinks to the external drive
# (/Volumes/ALICE_EXT/data/ML/). Do not add the old AO2D25f3.root (window 0.05): it contains the same candidates.
input:
  files:
  - ../../data/pbpb/*.root
  df_prefix: DF_
  tree: O2camlcandidates
  step_size: 100 MB

features:
  cascradius:          {column: fCascRadius}
  v0radius:            {column: fV0radius}
  casccosPA:           {column: fCascPA, transform: cos}
  v0cosPA:             {column: fV0PA,   transform: cos}
  dcapostopv:          {column: fDCApostopv}
  dcanegtopv:          {column: fDCAnegtopv}
  dcabachtopv:         {column: fDCAbachtopv}
  dcacascdaughters:    {column: fDCACascDaughters}
  dcaV0daughters:      {column: fDCAV0daughters}
  dcav0topv:           {column: fDCAv0topv}
  bachBaryonCosPA:     {column: fBachBaryonCosPA}
  bachBaryonDCAxyToPV: {column: fBachBaryonDCAxyToPV}

species:
  omega:
    mass_window_bit: 1
    signal_flags: {minus: fIsOmegaMinus, plus: fIsOmegaPlus}
    split_by_charge: false
    pt_bins: [0.5, 1.5, 3.0, 10.0]
    # ~59 M background candidates in the Omega window; keep 20% (all signal is kept).
    bkg_fraction: 0.2

classes:
  - {name: bkg, source: mc}
  - {name: signal, source: mc}

preselection: []

# Hyperloop train config (cascade-m-l-selection-tree-creator); checked against the data:
# these are also the effective cuts (no tighter upstream cut).
tree_creator_cuts:
  getXiMinus: false
  getXiPlus: false
  getOmegaMinus: true
  getOmegaPlus: true
  xiMassWindow: 0.01
  omegaMassWindow: 0.02
  v0setting_cospa: 0.97
  v0setting_dcav0dau: 1.0
  v0setting_dcapostopv: 0.05
  v0setting_dcanegtopv: 0.05
  v0setting_radius: 0.9
  cascadesetting_cospa: 0.97
  cascadesetting_dcacascdau: 1.0
  cascadesetting_dcabachtopv: 0.05
  cascadesetting_cascradius: 0.9
  cascadesetting_v0masswindow: 0.01
  cascadesetting_mindcav0topv: 0.05

split:
  test_size: 0.3
  n_folds: 5
  random_state: 42

guards:
  min_signal_train: 200
  min_signal_test: 50

validation:
  auc_ci: {method: delong, level: 0.95}  # method: delong | bootstrap
  bootstrap: {n: 1000}                   # replicas, used only with auc_ci.method: bootstrap
  working_points: [0.7, 0.8, 0.9]

export:
  onnx_dir_name: onnx
