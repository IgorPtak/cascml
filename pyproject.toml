[project]
name = "cascml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ptak", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "hipe4ml>=0.0.14",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.0",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uproot>=5.7.7",
    "xgboost>=3.4.1",
]

[project.scripts]
cascml = "cascml:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
